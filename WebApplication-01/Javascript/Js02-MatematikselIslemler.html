    <!--Örnek Yapı-->
    <script>
        let sayi1 = parseInt(window.prompt("Sayı 1: ", "0"));
        let sayi2 = parseInt(window.prompt("Sayı 2: ", "0"));

        let sonuc = (sayi1 + sayi2) * (sayi1 % sayi2) + sayi1 / sayi2;

        document.writeln(sonuc);
    </script>
