    <script language="javascript">
        let fiyat, miktar, tutar, fiy, mik;
        fiyat = window.prompt("fiyatı girin", "0");
        miktar = window.prompt("miktar girin", "0");
        fiy = parseInt(fiyat);//string olan fiyatı int olarak parse ettik
        mik = parseInt(miktar);//string olan miktarı da int olarak parse ettik
        tutar = fiy * mik;
        document.writeln('<h1>Fiyat = ' + fiyat + '<h1>');
        document.writeln('<h1>Miktar = ' + miktar + '<h1>');
        document.writeln('<h1>Tutar = ' + tutar + '<h1>');
    </script>
