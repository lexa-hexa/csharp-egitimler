<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Javascript Karar Yapıları</title>
    <script>
        let say;
        say = window.prompt("Bir sayı giriniz: ", "0");
        s = parseInt(say);
        if (s > 0) document.writeln("<h2>Sayı pozitiftir!</h2>");
        else if (s < 0) document.writeln("<h2>Sayı negatif!</h2>");
        else document.writeln("<h2>Sayı 0'dır</h2>");
    </script>
</head>
<body>
</body>
</html>
