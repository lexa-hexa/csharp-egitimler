<!DOCTYPE html>

<body>
    <h1>Olayların Kullanımı</h1>
    <a href="#" onclick="alert('onclick olayı gerçekleşti'); return false">Tıklayın</a>

    <h2>Örnek 2</h2>
    <h3>Cinsiyet Seçiniz</h3>
    <form name="cinsiyet">
        <input id="Radio1" type="radio" name="cins" value="Kadın" />Kadın
        <input id="Radio2" type="radio" name="cins" value="Erkek" />Erkek
        <input id="Button1" type="button" value="seç" onclick="goster()" />
    </form>
    <script>
        function goster() {
            var m = " ";
            if (document.cinsiyet.cins[0].checked) {
                m = 'Kadın';
            }
            if (document.cinsiyet.cins[1].checked) {
                m = 'Erkek';
            }
            alert("Seçilen cinsiyet: " + m);
        }

        function kontrol() {
            str = "Google git";
            if (confirm(str)) {
                location.href = "https://www.google.com/";
            }
        }
    </script>
    <hr />
    <input id="btnGoogle" type="button" value="Goo >> gle" onclick="kontrol()" />

    <hr />

    <h2>Örnek 3 onMouseOver Olayı</h2>
    <a href="" onmouseover="alert('A tagının üzerine mouse geldi'); return false">onMouseOver</a>
    
    <hr />


</body>
</html>
